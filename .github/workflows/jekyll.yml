# Workflow for building and deploying the academic personal website to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Check rendered content
        run: |
          python - <<'PY'
          from pathlib import Path

          about = Path('_site/index.html').read_text()
          publications = Path('_site/publications/index.html').read_text()
          titles = [
              'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
              'On the Perception Bottleneck of VLMs for Chart Understanding',
              'On the Universal Truthfulness Hyperplane Inside LLMs',
              'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
              'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
              'Composing Parameter-Efficient Modules with Arithmetic Operations',
          ]
          for title in titles:
              assert title in about, f'Missing from About page: {title}'
              assert title in publications, f'Missing from Publications page: {title}'
          for detail in [
              'jliugi@connect.ust.hk',
              'Hong Kong University of Science and Technology',
              'Shanghai Jiao Tong University',
              'MINIMAX',
              'Tencent WXG',
              'Shanghai AI Lab',
              'Zhiyuan Honor Scholarship',
              'Natural Language Processing',
              'Machine Learning',
              'Research Experience',
              'Skills',
              'Contact',
          ]:
              assert detail in about, f'Missing from About page: {detail}'
          print('All six publications and the profile sections are present on the rendered pages.')
          PY
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
      - name: Check published site
        run: |
          for path in '' 'publications/'; do
            url="https://spanellisnikolaos564-eng.github.io/LJT-Homepage/${path}"
            code=$(curl -s -L -o /dev/null -w '%{http_code}' "$url")
            echo "HTTP ${code}: ${url}"
          done